[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "entitykit"
dynamic = ["version"]
description = "Türkçe web içeriğinde varlık salience, bilgi kazancı ve konu otoritesi ölçer; metni değiştirmez."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "nazim" }]
# Test edilen sürümler: Python 3.11, torch 2.12, transformers 5.6.2,
# sentence-transformers 5.5.1, gliner 0.2.27, networkx 3.6.1, zeyrek 0.1.3.
dependencies = [
    "torch>=2.0",
    "transformers>=4.51.3,<5.7.0",  # gliner bu sınırı ister
    "sentence-transformers>=3.0",
    "gliner>=0.2.27",
    "numpy>=1.24",
    "networkx>=3.0",
    "zeyrek>=0.1.3",
    "nltk>=3.9",
    # GLiNER'ın mdeberta tokenizer'ını dönüştürmek için; yoksa temiz kurulumda
    # transformers tiktoken'a düşer ve hata verir.
    "protobuf",
]

[project.urls]
Homepage = "https://github.com/nazim/entitykit"

[project.scripts]
entitykit = "entitykit.cli:main"

[tool.setuptools]
packages = ["entitykit"]

[tool.setuptools.dynamic]
version = { attr = "entitykit.__version__" }
